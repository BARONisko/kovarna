:root {
  --bg: #0e1a22;
  --panel: #13232d;
  --chip: #1b3140;
  --chip-2: #22394a;
  --text: #eaf4f4;
  --muted: #7f9ba6;
  --accent: #1fc7a8;
  --accent-dark: #0d7a66;
  --danger: #e5484d;
  --good: #5bd46a;
  --gold: #f2c14e;
  --r: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: "Rubik", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }
body { display: flex; justify-content: center; }
#app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); padding-top: var(--safe-top); }

/* ---------- Horní lišta ---------- */
#hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel); flex: none; }
.res { display: flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 4px 10px 4px 4px;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; position: relative; }
.res-icon svg { width: 22px; height: 22px; }
.res-timer { font-size: 10px; font-weight: 700; color: var(--muted); margin-left: -2px; }
.res-timer:empty { display: none; }
.spacer { flex: 1; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--chip); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- Boj ---------- */
#battle { position: relative; flex: 1 1 auto; min-height: 230px; overflow: hidden; container-type: size; }
#scene { position: absolute; inset: 0; overflow: hidden; }
#scene .layer { position: absolute; left: 0; bottom: 0; width: 100%; will-change: transform; }
#scene .layer.tiled { width: 500%; }
#scene .flick { animation: flick 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flick { 0% { opacity: 1; transform: scale(1); } 30% { opacity: .75; transform: scale(.94, 1.04); } 60% { opacity: .95; transform: scale(1.03, .97); } 100% { opacity: .8; transform: scale(.97, 1.02); } }
#scene .motes { position: absolute; inset: 0; pointer-events: none; }
#scene .motes i { position: absolute; width: 3px; height: 3px; border-radius: 50%; opacity: 0; animation: mote linear infinite; }
@keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: .55; } 80% { opacity: .35; } 100% { opacity: 0; transform: translate(-30px, 40px); } }
#scene .motes.embers i { animation-name: ember; }
@keyframes ember { 0% { opacity: 0; transform: translate(0, 60px); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(15px, -50px); } }
@media (prefers-reduced-motion: reduce) { #scene .flick, #scene .motes i { animation: none; } #scene .motes { display: none; } }
#scene .layer svg { width: 100%; height: auto; }
#stage { position: absolute; top: 10px; left: 0; right: 0; text-align: center; z-index: 2; }
#depth-label { display: inline-block; font-weight: 800; font-size: 14px; background: rgba(0,0,0,.3); padding: 5px 14px; border-radius: 999px; }
#waves { display: flex; gap: 4px; justify-content: center; margin-top: 7px; }
#waves i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); }
#waves i.done { background: var(--accent); }
#waves i.now { background: var(--text); }
#waves i.boss { width: 18px; background: rgba(229,72,77,.6); }
#waves i.boss.now { background: var(--danger); }

/* nohy postav na podlaze: podlaha je ve 3/4 výšky pozadí, pozadí je vysoké jako široké */
.fighter { position: absolute; bottom: 14cqw; display: flex; flex-direction: column; align-items: center; z-index: 1; }
#hero { left: 9%; }
#monster { right: 8%; }
.fighter .sprite { transition: opacity .3s; }
#hero .sprite svg { width: 140px; height: 153px; overflow: visible; }
#monster .sprite svg { width: 132px; height: 104px; overflow: visible; }
#monster.boss .sprite svg { width: 176px; height: 138px; }
.hp-bar { width: 86px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.45); overflow: hidden; margin-bottom: 6px; }
.hp-fill { height: 100%; background: var(--good); width: 100%; transition: width .15s; }
.hp-bar.enemy .hp-fill { background: var(--danger); }
.mon-name { font-size: 11px; font-weight: 800; color: rgba(234,244,244,.75); margin-bottom: 4px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
#monster.boss .mon-name { color: var(--gold); }
#hero.down .sprite { transform: translate(-14px, 30px) rotate(-78deg); opacity: .55; transition: transform .35s ease-in, opacity .35s; transform-origin: 30% 95%; }
#hero.down .hp-bar { opacity: 0; }
/* chůze: poskakování */
.fighter.walking .sprite svg { animation: walk .32s ease-in-out infinite; }
@keyframes walk { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-5px) rotate(-2deg); } 75% { transform: translateY(-5px) rotate(2deg); } }
/* létající příšera se vznáší */
#monster.flying .sprite svg { animation: fly 1s ease-in-out infinite; }
@keyframes fly { 0%,100% { transform: translateY(-34px); } 50% { transform: translateY(-46px); } }
/* poražená příšera klesne a zmizí */
.corpse { position: absolute; z-index: 0; pointer-events: none; animation: corpse .6s ease-in forwards; transform-origin: 50% 100%; }
.corpse svg { width: 100%; height: auto; overflow: visible; }
@keyframes corpse { 0% { opacity: 1; transform: none; filter: brightness(2.2); } 25% { filter: brightness(1); } 100% { opacity: 0; transform: translateY(14px) scaleY(.35) rotate(8deg); } }

/* údery: výpad útočníka, záblesk a cuknutí zasaženého */
#hero .sprite.atk { animation: atk-r .28s ease-out; }
#monster .sprite.atk { animation: atk-l .28s ease-out; }
.sprite.hit svg { animation: hit-flash .2s ease-out; }
#hero .sprite.hit { animation: knock-l .2s ease-out; }
#monster .sprite.hit { animation: knock-r .2s ease-out; }
@keyframes atk-r { 0%,100% { transform: translateX(0); } 40% { transform: translateX(38px) rotate(5deg); } }
@keyframes atk-l { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-38px); } }
@keyframes knock-r { 0%,100% { transform: translateX(0); } 40% { transform: translateX(8px); } }
@keyframes knock-l { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-8px); } }
@keyframes hit-flash { 0% { filter: brightness(3); } 100% { filter: brightness(1); } }
/* klidné pohupování */
#hero .sprite svg, #monster .sprite svg { animation: idle 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
#monster .sprite svg { animation-delay: -1.2s; }
@keyframes idle { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }

/* ---------- Síla ---------- */
#power { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; background: var(--panel); flex: none; }
#power .big { display: flex; align-items: baseline; gap: 8px; }
#power .big span { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
#power .big strong { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
#hero-stats { display: flex; gap: 14px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
#hero-stats span { display: flex; align-items: center; gap: 5px; }
#hero-stats svg { width: 18px; height: 18px; }

/* ---------- Kovárna ---------- */
#forge { background: var(--panel); padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 12px; flex: none; }
#equipment { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.slot { position: relative; aspect-ratio: 1; border-radius: var(--r); display: grid; place-items: center; overflow: hidden;
  background: color-mix(in srgb, var(--rc, #3a5361) 22%, var(--bg)); }
.slot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--rc); }
.slot svg { width: 66%; height: 66%; }
.slot .lvl { position: absolute; bottom: 4px; right: 5px; font-size: 11px; font-weight: 900; color: #fff;
  -webkit-text-stroke: 3px rgba(0,0,0,.7); paint-order: stroke fill; }
.slot.empty { background: var(--chip); }
.slot.empty::after { display: none; }
.slot.glow { box-shadow: inset 0 0 14px color-mix(in srgb, var(--rc) 55%, transparent); }

#actions { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
.side-btn .ring { width: 58px; height: 58px; border-radius: 50%; background: var(--chip); display: grid; place-items: center;
  font-size: 20px; color: var(--text); font-weight: 900; }
.side-btn .ring svg { width: 28px; height: 28px; }
.side-label { text-align: center; line-height: 1.15; display: flex; flex-direction: column; align-items: center; }
.side-label small { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text); }
.side-label small svg { width: 13px; height: 13px; }
#btn-forge-lvl.ready .ring { background: var(--gold); color: #3a2a05; animation: pulse 1.4s ease-in-out infinite; }
#btn-forge-lvl.ready .ring svg { width: 30px; height: 30px; }
#btn-forge-lvl.ready.poor .ring { background: var(--chip-2); color: var(--muted); animation: none; }
#btn-forge-lvl.ready .side-label { color: var(--gold); }
#btn-forge-lvl.ready.poor .side-label { color: var(--muted); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,193,78,.6); } 50% { box-shadow: 0 0 0 8px rgba(242,193,78,0); } }

#anvil { width: 148px; height: 148px; border-radius: 50%; background: var(--accent); color: #fff;
  box-shadow: 0 6px 0 var(--accent-dark), 0 0 0 6px var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform .08s; }
#anvil:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-dark), 0 0 0 6px var(--chip); }
.anvil-art svg { width: 84px; height: 70px; }
.anvil-label { font-weight: 900; font-size: 20px; letter-spacing: 2px; margin-top: -2px; }
.anvil-cost { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; }
.anvil-cost svg { width: 13px; height: 13px; }
#anvil.empty { background: #2a4250; box-shadow: 0 6px 0 #1a2c36, 0 0 0 6px var(--chip); color: var(--muted); }
#anvil.empty .anvil-art { opacity: .45; }

.xp-bar { position: relative; height: 20px; border-radius: 10px; background: var(--chip); overflow: hidden; }
.xp-fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.xp-bar.full .xp-fill { background: var(--gold); }
.xp-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; color: var(--text);
  text-shadow: 0 1px 2px rgba(0,0,0,.6); line-height: 1; }

/* ---------- Spodní menu ---------- */
#nav { display: grid; grid-template-columns: repeat(5, 1fr); background: #0b151c; flex: none; padding-bottom: var(--safe-bottom); }
#nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 10px; color: var(--muted); font-size: 11px; font-weight: 800; }
#nav button svg { width: 26px; height: 26px; }
#nav button.on { color: var(--text); background: var(--panel); box-shadow: inset 0 3px 0 var(--accent); }

/* ---------- Překryvná okna ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4,10,14,.78); display: grid; place-items: center; z-index: 50; padding: 16px; }
.hidden { display: none !important; }
.panel { width: 100%; max-width: 360px; background: var(--panel); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { font-size: 18px; font-weight: 900; }
.btn { padding: 12px; border-radius: 14px; background: var(--chip); font-weight: 900; font-size: 15px; }
.btn small { display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 3px; }
.btn small svg { width: 12px; height: 12px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.primary small { color: rgba(255,255,255,.85); }
.btn.smelt { background: var(--chip-2); box-shadow: 0 4px 0 #142430; }
.btn.danger { background: #5a1c20; }
.btn.recommended { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.small { font-size: 12px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-bottom)); transform: translateX(-50%); background: rgba(4,10,14,.92);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 60; pointer-events: none;
  display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#toast svg { width: 14px; height: 14px; }

/* ---------- Karta předmětu + porovnání ---------- */
.compare-panel { max-width: 400px; padding: 14px; }
#compare-verdict { text-align: center; font-weight: 900; font-size: 16px; padding: 8px; border-radius: 12px; }
#compare-verdict.up { color: #6fe07a; background: rgba(91,212,106,.12); }
#compare-verdict.down { color: #ff6b70; background: rgba(229,72,77,.12); }
#compare-verdict.same { color: var(--muted); background: var(--chip); }
#compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.compare-label { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
.item-card { --rarity: #3a5361; height: 100%; background: var(--bg); border-radius: 16px; padding: 10px; text-align: center; position: relative; overflow: hidden; }
.item-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--rarity); }
.item-icon { width: 72px; height: 72px; margin: 6px auto 6px; border-radius: 16px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--rarity) 22%, var(--chip)); }
.item-icon svg { width: 52px; height: 52px; }
.item-rarity { color: var(--rarity); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
.item-name { font-weight: 900; font-size: 15px; margin-top: 2px; }
.item-meta { font-size: 11px; color: var(--muted); margin: 2px 0 6px; font-weight: 700; }
.item-power { display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; font-weight: 900; font-size: 14px; margin-bottom: 6px; }
.item-power svg { width: 15px; height: 15px; }
.item-stats { display: flex; flex-direction: column; gap: 4px; }
.stat-line { display: flex; justify-content: space-between; align-items: center; gap: 4px; background: var(--chip); padding: 6px 8px; border-radius: 10px; font-size: 13px; font-weight: 800; }
.stat-line span { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.stat-line svg { width: 14px; height: 14px; color: var(--text); }
.stat-line b { display: flex; flex-direction: column; align-items: flex-end; }
.item-card.empty { opacity: .7; }
.diff { font-size: 11px; font-weight: 900; }
.diff.up { color: #6fe07a; }
.diff.down { color: #ff6b70; }

/* ---------- Šance ---------- */
#chances-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
#chances-table th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 800; padding: 4px 6px; }
#chances-table td { padding: 7px 6px; border-top: 1px solid var(--chip); font-weight: 700; }
#chances-table td:not(:first-child), #chances-table th:not(:first-child) { text-align: right; }
#chances-table .diff { font-size: 14px; }

/* ---------- Malé telefony ---------- */
@media (max-height: 720px) {
  #battle { min-height: 150px; }
  .fighter { scale: .88; transform-origin: 50% 100%; bottom: 9cqw; }
  #hud { padding: 7px 10px; }
  .res { font-size: 14px; }
  #power { padding: 6px 14px 2px; }
  #power .big strong { font-size: 20px; }
  #forge { padding: 6px 14px 8px; }
  #nav button { padding: 6px 0 7px; }
  #nav button svg { width: 22px; height: 22px; }
  #anvil { width: 112px; height: 112px; }
  .anvil-art svg { width: 58px; height: 48px; }
  .anvil-label { font-size: 16px; }
  .xp-bar { height: 18px; }
}
@media (max-height: 720px) and (min-height: 1px) {
  .anvil-art svg { width: 66px; height: 54px; }
  .anvil-label { font-size: 17px; }
  .side-btn .ring { width: 50px; height: 50px; }
  #hero .sprite svg { width: 118px; height: 129px; }
  #monster .sprite svg { width: 112px; height: 88px; }
  #monster.boss .sprite svg { width: 146px; height: 115px; }
  #forge { gap: 9px; }
}

/* =====================================================================
   Efekty
   ===================================================================== */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
#fx > * { position: absolute; pointer-events: none; }

/* Úder do kovadliny */
#anvil.strike { animation: anvil-strike .22s ease-out; }
#anvil.strike .hammer { animation: hammer .22s ease-out; transform-origin: 70px 40px; }
@keyframes anvil-strike { 0% { transform: scale(1); } 40% { transform: translateY(4px) scale(.95); } 100% { transform: scale(1); } }
@keyframes hammer { 0% { transform: rotate(0); } 35% { transform: rotate(-30deg); } 60% { transform: rotate(12deg); } 100% { transform: rotate(0); } }

/* Jiskry */
.spark { width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c), 0 0 2px #fff; animation: spark .5s ease-out forwards; }
@keyframes spark { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* Záblesk vzácnosti přes celou obrazovku */
.rarity-flash { inset: 0; z-index: 60; background: radial-gradient(circle at var(--x) var(--y), var(--c), transparent 70%); opacity: 0; animation: rflash .6s ease-out forwards; }
@keyframes rflash { 0% { opacity: var(--o); } 100% { opacity: 0; } }
.rarity-ring { width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 4px solid var(--c); box-shadow: 0 0 20px var(--c); animation: ring .7s ease-out forwards; }
@keyframes ring { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(7); opacity: 0; } }
.rarity-rays { width: 520px; height: 520px; margin: -260px; border-radius: 50%; z-index: 49;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--c) 55%, transparent) 0deg 8deg, transparent 8deg 24deg);
  mask: radial-gradient(circle, #000 10%, transparent 65%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 65%);
  animation: rays 1.4s ease-out forwards; }
@keyframes rays { 0% { transform: scale(.2) rotate(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.3) rotate(60deg); opacity: 0; } }

/* Karta nového předmětu */
.item-card.reveal { animation: reveal .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes reveal { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.item-card.glow { animation: reveal .35s cubic-bezier(.2,1.6,.4,1), glow 1.6s ease-in-out .35s infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 0 16px color-mix(in srgb, var(--rarity) 40%, transparent); } 50% { box-shadow: 0 0 34px var(--rarity); } }

/* Vyskakující čísla */
.float-text { transform: translate(-50%, -50%); font-weight: 900; font-size: 1.15rem; white-space: nowrap; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: float-up .9s ease-out forwards; }
.float-text.dmg { color: #fff; }
.float-text.hurt { color: #ff5a4f; }
.float-text.gold { color: #ffd34d; font-size: 1.05rem; animation-duration: 1.2s; }
@keyframes float-up { 0% { transform: translate(-50%, -20%) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -260%) scale(1); opacity: 0; } }

/* Odskočení číselných hodnot */
.bump { animation: bump .3s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* Vylepšení kovárny */
#forge-level.level-up .xp-bar { animation: lvl-bar .8s ease-out; }
@keyframes lvl-bar { 0% { box-shadow: 0 0 0 #ffd36b; } 30% { box-shadow: 0 0 18px #ffd36b; background: #ffd36b; } 100% { box-shadow: 0 0 0 #ffd36b; } }

/* Banner uprostřed bojové scény */
.banner { left: 0; right: 0; top: 18%; text-align: center; z-index: 48; animation: banner 1.8s ease-out forwards; }
.banner span { display: inline-block; font-size: 2rem; font-weight: 900; letter-spacing: 2px; color: var(--c); text-shadow: 0 3px 0 #000, 0 0 18px var(--c); }
.banner small { display: block; font-weight: 700; color: var(--text); text-shadow: 0 2px 0 #000; }
@keyframes banner { 0% { transform: scale(2.2); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }

/* Smrt hrdiny */
.vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, var(--c)); animation: rflash 1.2s ease-out forwards; --o: 1; }

/* Třes obrazovky */
#app.shake { animation: shake .3s linear; }
#app.shake-big { animation: shake-big .6s linear; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-1px); } 80% { transform: translate(3px,1px); } }
@keyframes shake-big { 0%,100% { transform: translate(0,0); } 10% { transform: translate(-9px,4px); } 25% { transform: translate(8px,-5px); } 40% { transform: translate(-7px,-3px); } 55% { transform: translate(6px,4px); } 70% { transform: translate(-4px,2px); } 85% { transform: translate(3px,-2px); } }

@media (prefers-reduced-motion: reduce) {
  .rarity-rays, #app.shake, #app.shake-big { animation: none !important; display: none; }
  .btn.upgrade { animation: none; }
}
.float-text { display: flex; align-items: center; gap: 4px; }
.float-text svg { width: 16px; height: 16px; }
.float-text.coal { color: #ff9a5a; font-size: 1.05rem; animation-duration: 1.3s; }
.xp-bar.full .xp-text { color: #3a2a05; text-shadow: none; }

/* =====================================================================
   Záložky: Obchod, Hrdina, Suroviny, Legendy
   ===================================================================== */
#app.tab-mode #power, #app.tab-mode #forge { display: none; }
#app.tab-mode #battle { flex: 0 0 34%; min-height: 200px; }
#tab-panel { flex: 1 1 auto; overflow-y: auto; background: var(--panel); padding: 12px 14px 16px; -webkit-overflow-scrolling: touch; user-select: text; }
#tab-panel h2 { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
#tab-panel h4 { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
.card { background: var(--bg); border-radius: 16px; padding: 10px; }
.card + .card { margin-top: 10px; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
.empty-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 8px; line-height: 1.5; }

.tile { width: 46px; height: 46px; flex: none; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden;
  background: color-mix(in srgb, var(--rc, #3a5361) 22%, var(--chip)); }
.tile::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--rc); }
.tile.empty, .tile.plain { background: var(--chip); }
.tile.empty::after, .tile.plain::after { display: none; }
.tile svg { width: 72%; height: 72%; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-main b { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main b.dim { color: var(--muted); }
.row-main span { font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.row-val { font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-val svg { width: 15px; height: 15px; }
.row-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.st { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.st svg { width: 14px; height: 14px; }
.row.locked { opacity: .45; }

/* obchod */
.offer { display: flex; align-items: center; gap: 12px; }
.offer-art { width: 64px; height: 64px; flex: none; border-radius: 16px; background: var(--chip); display: grid; place-items: center; position: relative; }
.offer-art svg { width: 44px; height: 44px; }
.offer-art b { position: absolute; right: 4px; bottom: 2px; font-size: 13px; font-weight: 900; }
.offer-text { flex: 1; min-width: 0; }
.offer-text h3 { font-size: 16px; font-weight: 900; }
.offer-text p { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.35; margin-top: 2px; }
.buy { flex: none; display: flex; align-items: center; gap: 5px; padding: 10px 12px; border-radius: 14px; background: var(--accent);
  box-shadow: 0 4px 0 var(--accent-dark); color: #fff; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
.buy svg { width: 18px; height: 18px; }
.buy:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
.buy:disabled { background: var(--chip); box-shadow: 0 4px 0 #142430; color: var(--muted); }

/* hrdina */
.hero-card { display: flex; align-items: center; gap: 12px; }
.hero-big { width: 120px; height: 152px; flex: none; overflow: visible; }
.hero-sum { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.hero-sum h3 { font-size: 18px; font-weight: 900; }
.hero-power, .hero-line { display: flex; align-items: center; gap: 6px; }
.hero-power svg, .hero-line svg { width: 18px; height: 18px; }
.hero-power b { font-size: 22px; font-weight: 900; }
.hero-line b { font-size: 16px; font-weight: 900; }
.hero-power span, .hero-line span { font-size: 12px; color: var(--muted); font-weight: 700; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat-tile { background: var(--bg); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat-tile span { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
.stat-tile b { font-size: 16px; font-weight: 900; }

/* legendy */
.slots-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.col-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
.col-slot .tile { width: 100%; height: auto; aspect-ratio: 1; }

.float-text.mat { color: #b6fff2; font-size: .95rem; animation-duration: 1.4s; }

/* V záložkách je bojiště nižší – postavy a nápis zmenšit, ať se nepřekrývají */
#app.tab-mode .fighter { scale: .78; transform-origin: 50% 100%; bottom: 10cqw; }
#app.tab-mode #depth-label { font-size: 12px; padding: 3px 10px; }
#app.tab-mode #waves { margin-top: 4px; }
#app.tab-mode #stage { top: 6px; }
@media (max-height: 720px) {
  #app.tab-mode .fighter { scale: .64; bottom: 7cqw; }
  #app.tab-mode #battle { flex-basis: 32%; min-height: 0; }
}

/* nastavení */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-weight: 800; }
.toggle { width: 50px; height: 28px; border-radius: 999px; background: var(--chip-2); position: relative; transition: background .15s; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle.on { background: var(--accent); }
.toggle.on i { transform: translateX(22px); background: #fff; }
#vol { flex: 1; max-width: 180px; accent-color: var(--accent); }

/* okno s odměnou */
.reward-panel { text-align: left; }
#reward-body { display: flex; flex-direction: column; gap: 6px; }
.rw-line { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 9px 12px; font-weight: 700; font-size: 14px; }
.rw-line svg { width: 18px; height: 18px; flex: none; }
.rw-line span { flex: 1; color: var(--muted); }
.rw-line b { font-weight: 900; text-align: right; }

/* runy předků */
.prestige { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
.prestige-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rune-count { display: flex; align-items: center; gap: 6px; }
.rune-count svg { width: 26px; height: 26px; }
.rune-count b { font-size: 24px; font-weight: 900; }
.rune-count span { color: var(--muted); font-weight: 700; }
.prestige .note { margin-top: 0; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .55; }
.lv { font-size: 11px; color: var(--muted); font-weight: 800; margin-left: 4px; }
.buy.small { padding: 8px 10px; font-size: 13px; }
.buy svg { width: 16px; height: 16px; }

/* odznak, úkoly */
.icon-btn { position: relative; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger);
  color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.panel.tall { max-height: 88dvh; padding: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; }
.panel-head .icon-btn { font-size: 22px; font-weight: 700; }
.panel-scroll { overflow-y: auto; margin: 0 -4px; padding: 0 4px 4px; }
.panel-scroll h4 { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; display: flex; justify-content: space-between; }
.q-time { text-transform: none; letter-spacing: 0; font-weight: 700; }
.login-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.lg { background: var(--bg); border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; color: var(--muted); }
.lg .rw { display: flex; flex-direction: column; align-items: center; color: var(--text); font-size: 11px; }
.lg .rw svg { width: 16px; height: 16px; }
.lg.got { opacity: .45; }
.lg.now { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--bg)); }
.quest { display: flex; align-items: center; gap: 10px; }
.quest + .quest { border-top: 1px solid var(--chip); padding-top: 8px; }
.q-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.q-main b { font-size: 14px; font-weight: 800; }
.q-bar { position: relative; height: 16px; border-radius: 8px; background: var(--chip); overflow: hidden; }
.q-bar i { display: block; height: 100%; background: var(--accent); }
.q-bar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 900; }
.q-rew { display: flex; gap: 8px; }
.rw { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 900; }
.rw svg { width: 14px; height: 14px; }
.quest.claimed { opacity: .5; }
.done-mark { font-size: 12px; font-weight: 900; color: var(--accent); }
.wallet { display: flex; gap: 8px; margin-bottom: 10px; }
.wallet span { display: flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 999px; padding: 4px 10px 4px 5px; font-weight: 900; font-size: 14px; }
.wallet svg { width: 18px; height: 18px; }

/* přísady */
.sockets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.socket { position: relative; aspect-ratio: 1.3; border-radius: 16px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.socket svg { width: 34px; height: 34px; }
.socket small { font-size: 11px; font-weight: 800; }
.socket i { position: absolute; top: 4px; right: 8px; font-style: normal; color: var(--muted); font-size: 16px; }
.socket.empty { border: 2px dashed var(--chip-2); color: var(--muted); font-size: 26px; font-weight: 300; }
.socket.lack { outline: 2px solid var(--danger); }
.socket.lack small::after { content: " – chybí"; color: var(--danger); }
.ch-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.ch-table th { font-size: 11px; color: var(--muted); font-weight: 800; text-align: right; padding: 3px 6px; }
.ch-table td { padding: 5px 6px; border-top: 1px solid var(--chip); font-weight: 700; text-align: right; }
.ch-table td:first-child { text-align: left; }
.slot-chances { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sc { background: var(--bg); border-radius: 10px; padding: 6px 8px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
.sc span { color: var(--muted); }
.sc.up b { color: #6fe07a; }
.mini-sockets { display: flex; gap: 1px; }
.mini-sockets i { width: 17px; height: 17px; display: grid; place-items: center; }
.mini-sockets i svg { width: 16px; height: 16px; }
.mini-sockets i.e::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--chip-2); }
.mini-sockets i.lack { opacity: .35; }

/* sloučení legendárek */
.stars { color: #ffc233; letter-spacing: -1px; }
.slot .star { position: absolute; top: 3px; left: 5px; font-size: 11px; font-weight: 900; color: #ffc233; -webkit-text-stroke: 3px rgba(0,0,0,.7); paint-order: stroke fill; }
.btn.merge { background: linear-gradient(90deg, #ff9f1a, #ff3b5c); color: #fff; box-shadow: 0 4px 0 #8a3a10; margin-top: 2px; }
.btn.merge small { color: rgba(255,255,255,.9); }

/* eventy a pomocníci */
#event-pill { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 999px; color: var(--text); }
#companions { position: absolute; inset: 0; pointer-events: none; }
.cp { position: absolute; }
.cp.havran { width: 46px; left: -26px; top: 6px; animation: cp-fly 1.6s ease-in-out infinite; }
.cp.skritek { width: 30px; left: -28px; bottom: 6px; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 100%; }
.cp.krtek { width: 40px; right: -20px; bottom: -4px; }
.cp.dracek { width: 44px; right: -34px; top: 18px; animation: cp-fly 2.2s ease-in-out infinite; }
@keyframes cp-fly { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
#app.tab-mode #event-pill { display: none; }
.cp-tile .cp { position: static; width: 80%; animation: none; }
.locked-soft .row-main b { color: var(--muted); }
.buy.col { flex-direction: column; gap: 1px; font-size: 11px; padding: 6px 9px; }
.buy.col span { display: flex; align-items: center; gap: 3px; }
.buy.col svg { width: 13px; height: 13px; }

/* diamantový obchod, kosmetika, průkaz */
.pass-card { cursor: pointer; }
.pass-card .q-bar { margin: 4px 0 2px; }
.hl { color: var(--gold); }
.offer .toggle { flex: none; }
.sw-title { font-size: 12px; font-weight: 800; color: var(--muted); margin: 2px 0 6px; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.swatch { background: var(--chip); border-radius: 12px; padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; }
.swatch i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
.swatch small { display: flex; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
.swatch small svg { width: 11px; height: 11px; }
.swatch.on { outline: 2px solid var(--accent); }
.swatch:disabled { opacity: .45; }
.q-bar.big { height: 22px; border-radius: 11px; margin: 8px 0; }
.q-bar.big span { font-size: 11px; }
.prow { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 6px; align-items: stretch; margin-top: 6px; }
.prow.head { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.prow.head .pc { background: none; padding: 0 4px; min-height: 0; }
.plv { display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; }
.prow.reached .plv { background: var(--accent); color: #062019; }
.pc { background: var(--bg); border-radius: 10px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 40px; }
.pc.prem { background: color-mix(in srgb, #b04cff 18%, var(--bg)); }
.pc .pr { display: flex; flex-wrap: wrap; gap: 4px; }
.pc.claimed { opacity: .45; }
.pc .buy.small { padding: 5px 8px; font-size: 12px; }

/* sloty: vylepšení a runy */
.slot .slv { position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 900; color: #6fe07a; -webkit-text-stroke: 3px rgba(0,0,0,.7); paint-order: stroke fill; }
.slot .srune { position: absolute; top: 5px; left: 50%; margin-left: -4px; width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 6px currentColor; }
.slot-item .item-card { padding-bottom: 12px; }
.row.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 12px; }
.buy .dim { opacity: .8; font-weight: 700; }
.float-text.crit { color: #ffd34d; font-size: 1.45rem; }
.float-text.dodge { color: #a6e4ff; font-size: .95rem; }

/* obchodník */
.mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.mchip { display: flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; font-weight: 800; }
.mchip svg { width: 16px; height: 16px; }
.mchip.on { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--chip)); }
.row .buy.small + .buy.small { margin-left: -4px; }
.lang-switch { display: flex; gap: 4px; background: var(--chip); border-radius: 999px; padding: 3px; }
.lang-switch button { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--muted); }
.lang-switch button.on { background: var(--accent); color: #fff; }

/* Kobky */
.dg { display: flex; gap: 10px; align-items: stretch; }
.dg.locked { opacity: .55; }
.dg-art { width: 78px; flex: none; border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.dg-art svg { width: 70px; height: 56px; }
.dg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dg-head { display: flex; align-items: center; justify-content: space-between; }
.dg-head b { font-size: 15px; font-weight: 800; }
.dg-keys { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; }
.dg-keys svg, .dg-stats svg { width: 14px; height: 14px; vertical-align: -2px; }
.dg-ok { color: var(--accent); font-weight: 800; }
.dg-hard { color: var(--danger); font-weight: 800; }
.dg-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.buy.ghost { background: var(--chip); box-shadow: 0 4px 0 #142430; color: var(--text); }
#battle.in-dungeon #waves, #battle.in-dungeon #event-pill { display: none; }
#dg-timer { display: none; margin-top: 7px; font-weight: 900; font-size: 14px; }
#battle.in-dungeon #dg-timer { display: block; }
#dg-timer.low { color: var(--danger); }
.dg-stats { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.dg-stats svg { display: inline-block; }
.dg-reward { justify-content: center; margin: 6px 0; }
.dg-reward .rw { font-size: 16px; }
.dg-reward .rw svg { width: 20px; height: 20px; }
.forge-unlocks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.fu { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 13px; opacity: .7; }
.fu.got { opacity: 1; }
.fu.got b { color: var(--accent); }

/* Útržky a dílna v kobkách */
.dg-shards { display: flex; align-items: center; gap: 8px; }
.dg-shards svg { width: 22px; height: 22px; }
.dg-shards b { font-size: 18px; font-weight: 900; }
.dg-workshop .row-main span { font-size: 12px; color: var(--muted); }
.cp-tile .cp.dracek { width: 80%; }

/* Relikvie: světélka kolem hrdiny */
.relic-orb { position: absolute; left: 50%; top: 45%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%;
  background: var(--rc); box-shadow: 0 0 8px 2px var(--rc); animation: relic-orbit 4.2s linear infinite; animation-delay: var(--d); }
@keyframes relic-orbit {
  0% { transform: translate(-38px, 0) scale(1); opacity: 1; } 25% { transform: translate(0, 12px) scale(1.2); opacity: 1; }
  50% { transform: translate(38px, 0) scale(1); opacity: .8; } 75% { transform: translate(0, -14px) scale(.7); opacity: .4; }
  100% { transform: translate(-38px, 0) scale(1); opacity: 1; } }
.relic-tile svg { filter: drop-shadow(0 0 4px var(--rc)); }
@media (prefers-reduced-motion: reduce) { .relic-orb { animation: none; } }
.dg-workshop .row-main b { white-space: normal; overflow: visible; text-overflow: clip; }

/* Dráček: ohnivý dech */
.cp.pet.breath { animation: cp-fly 2.2s ease-in-out infinite, dragon-breath .45s ease-out; }
@keyframes dragon-breath { 0% { scale: 1; } 30% { scale: 1.25 .9; } 100% { scale: 1; } }
.pet-flame { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 25%, var(--pc, #ff7a2a) 55%, transparent 76%);
  box-shadow: 0 0 14px 6px var(--pc, #ff7a2a); animation: pet-flame .3s ease-in forwards; }
@keyframes pet-flame { 0% { transform: translate(0, 0) scale(.6); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.6); opacity: .9; } }
.float-text.fire { color: #ff8a3d; font-size: 1.3rem; }
.item-subs { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sub-line { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #b9a6ff; padding: 0 4px; }
.sub-line b { font-weight: 900; }

/* Mazlíček v boji (aktivní) */
.cp.pet { width: 44px; right: -34px; top: 18px; animation: cp-fly 2.2s ease-in-out infinite; }
.cp.pet.brouk, .cp.pet.zelva, .cp.pet.liska { top: auto; bottom: -2px; right: -40px; width: 40px; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 100%; }
.cp-tile .cp.pet { position: static; width: 80%; animation: none; }
.cp-tile .q { font-size: 22px; font-weight: 900; color: var(--muted); }
.pet-btns { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.row.pet-on { box-shadow: inset 3px 0 0 var(--accent); }

/* Podzáložky (Hrdina) */
.subnav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); border-radius: 14px; padding: 4px; margin-bottom: 12px; position: sticky; top: -12px; z-index: 2; }
.subnav button { position: relative; padding: 9px 2px; border-radius: 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
.subnav button.on { background: var(--chip); color: var(--text); }
.subnav .dot, #nav .badge { position: absolute; }
.subnav .dot { top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
#nav button { position: relative; }
#nav .badge { top: 4px; right: calc(50% - 22px); }

/* Dovednosti */
.sk-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sk-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; text-align: center; color: var(--text); }
.sk-slot.empty { color: var(--muted); }
.sk-tile { position: relative; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--chip); color: var(--rc, var(--muted)); box-shadow: inset 0 -4px 0 var(--rc, transparent); flex: none; }
.sk-tile svg { width: 30px; height: 30px; }
.sk-tile.locked { opacity: .35; filter: grayscale(1); }
.sk-tile.on { outline: 2px solid var(--accent); }
.sk-tile.empty { font-size: 18px; font-weight: 900; box-shadow: none; border: 2px dashed var(--chip-2); background: transparent; }
.sk-lv { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--rc); color: #10161c; font-size: 11px; font-weight: 900; display: grid; place-items: center; padding: 0 4px; }
.summon { display: flex; flex-direction: column; gap: 8px; }
.summon .buy { justify-content: center; }
.summon .spacer { flex: 1; }
.row-main .q-bar { margin-top: 3px; height: 14px; }

/* Lišta dovedností v boji */
#skill-bar { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; z-index: 3; pointer-events: none; }
.sb-skill { position: relative; width: 34px; height: 34px; border-radius: 10px; background: rgba(0,0,0,.45); color: var(--rc); display: grid; place-items: center; overflow: hidden; box-shadow: inset 0 -3px 0 var(--rc); }
.sb-skill svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.sb-skill i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); z-index: 2; }
.sb-skill.ready { box-shadow: inset 0 -3px 0 var(--rc), 0 0 8px var(--rc); }
.float-text.skill { color: #fff; font-size: 1rem; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 8px; }
.float-text.heal { color: #5be37d; font-size: 1.2rem; }
.rs-tile svg { width: 26px; height: 26px; color: var(--accent); }
.sub-line b { white-space: nowrap; }

/* Další cíl (v boji vpravo dole) */
#goal { position: absolute; right: 8px; bottom: 8px; z-index: 3; max-width: calc(100% - 140px); display: flex; align-items: center; gap: 6px;
  background: rgba(8, 18, 24, .78); border-radius: 12px; padding: 6px 10px; font-size: 11px; font-weight: 800; color: var(--text); text-align: left; line-height: 1.2; }
#goal .g-ico svg { width: 18px; height: 18px; display: block; }
#goal .g-txt { flex: 1; min-width: 0; }
#goal b { flex: none; color: var(--accent); }
#goal.done { background: #1fc7a8; color: #06231d; animation: goal-pulse 1.2s ease-in-out infinite; }
#goal.done b { color: #06231d; }
@keyframes goal-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
#battle.in-dungeon #goal { display: none; }

/* Zamčené funkce */
#nav button.locked { opacity: .35; }
#nav button.locked svg { filter: grayscale(1); }
#nav button.new::after { content: ''; position: absolute; inset: 4px 10%; border-radius: 12px; box-shadow: 0 0 0 2px var(--accent); animation: goal-pulse 1s ease-in-out infinite; pointer-events: none; }
.side-btn.locked { opacity: .35; }
.subnav button.locked { opacity: .35; }

/* Truhla z hlubin */
.big-chest { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px auto 4px; color: var(--muted); font-weight: 800; }
.big-chest svg { width: 120px; height: 120px; filter: drop-shadow(0 0 18px rgba(242, 193, 78, .45)); animation: chest-idle 1.6s ease-in-out infinite; }
.big-chest.opening svg { animation: chest-open .65s ease-in forwards; }
@keyframes chest-idle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.04); } }
@keyframes chest-open { 0% { transform: scale(1); } 30% { transform: scale(.9, 1.1) rotate(-6deg); } 60% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1.4); opacity: 0; } }

/* Kolo štěstí */
.wheel-wrap { position: relative; width: min(78vw, 300px); margin: 6px auto 10px; }
.wheel-disc { width: 100%; height: auto; display: block; transition: transform 3.2s cubic-bezier(.17, .67, .12, .99); }

function gemSvg(color) {

function itemTile(slotId, item) {

// Výběr pro výměnu surovin (drží main.js)
const merchantSel = { from: null, to: null };

function knownMaterials(state) {
  const known = Math.min(8, Math.max(state.progress.maxLayer + 1, state.prestige.bestDepth ? 8 : 1));
  return LAYERS.map((l, i) => ({ id: l.material.id, name: l.material.name, color: l.theme.crystal, i }))
    .filter((m) => m.i < known || (state.materials[m.id] ?? 0) > 0);
}

function merchantHtml(state) {
  const mats = knownMaterials(state);
  const rows = mats.map((m) => {
    const price = materialPackPrice(state, m.id);
    const have = state.materials[m.id] ?? 0;
    return `<div class="row"><div class="tile plain">${gemSvg(m.color)}</div>
      <div class="row-main"><b>${m.name}</b><span>${tr('máš {v}', { v: formatNumber(have) })}</span></div>
      <button class="buy small" data-action="m-sell" data-id="${m.id}" ${have >= 1 ? '' : 'disabled'} title="${tr('Prodat za rudu')}">${formatNumber(Math.min(10, have) || 10)}→${ICON.ore}</button>
      <button class="buy small" data-action="m-buy" data-id="${m.id}" ${state.gold < price ? 'disabled' : ''}>+${MERCHANT.materialPack} ${ICON.gold}${formatNumber(price)}</button></div>`;
  }).join('');
  const chip = (kind) => mats.map((m) => `<button class="mchip ${merchantSel[kind] === m.id ? 'on' : ''}" data-action="m-${kind}" data-id="${m.id}">${gemSvg(m.color)}<span>${m.name}</span></button>`).join('');
  const { from, to } = merchantSel;
  const canSwap = from && to && from !== to && (state.materials[from] ?? 0) >= MERCHANT.swapRate;
  const fromHave = from ? state.materials[from] ?? 0 : 0;
  const orePrice = orePackPrice(state);
  return `
    <h4>${tr('Obchodník')}</h4>
    ${offer(ICON.ore, `${tr('Ruda')} ×${MERCHANT.orePack}`, tr('Na vylepšení kovárny a Truhlu mistra.'),
      `<button class="buy" data-action="m-ore" ${state.gold < orePrice ? 'disabled' : ''}>${ICON.gold}${formatNumber(orePrice)}</button>`)}
    <div class="card list">${rows || `<div class="empty-msg">${tr('Suroviny hlubin najdeš u příšer.')}</div>`}</div>
    <p class="note" style="margin-top:6px">${tr('Šipka → ruda: 1 kus suroviny = {v} rudy (prodá až 10 kusů).', { v: MERCHANT.oreRate })}</p>
    <h4>${tr('Výměna surovin')} <span class="q-time">${MERCHANT.swapRate} : 1</span></h4>
    <div class="card">
      <div class="sw-title">${tr('Dám')}</div><div class="mchips">${chip('from')}</div>
      <div class="sw-title">${tr('Dostanu')}</div><div class="mchips">${chip('to')}</div>
      <div class="btn-row">
        <button class="btn ${canSwap ? 'primary' : ''}" data-action="m-swap" data-n="1" ${canSwap ? '' : 'disabled'}>${tr('Vyměnit 1×')}<small>${MERCHANT.swapRate} → 1</small></button>
        <button class="btn ${canSwap && fromHave >= MERCHANT.swapRate * 10 ? 'primary' : ''}" data-action="m-swap" data-n="10" ${canSwap && fromHave >= MERCHANT.swapRate * 10 ? '' : 'disabled'}>${tr('Vyměnit 10×')}<small>${MERCHANT.swapRate * 10} → 10</small></button>
      </div>
    </div>`;
}

  const h = getHeroStats(state);
  const power = itemPower({ attack: h.attack, hp: h.hp });

    const it = state.equipment[slot.id];
    if (!it) {
      return `<div class="row">${itemTile(slot.id, null)}<div class="row-main"><b class="dim">${slot.name}</b><span>${tr('prázdné')}</span></div></div>`;
    }
    const stats = Object.keys(STATS).filter((k) => k in it.stats)
      .map((k) => `<span class="st">${ICON[k]}${formatNumber(it.stats[k])}</span>`).join('');
    return `<div class="row">${itemTile(slot.id, it)}
      <div class="row-main"><b>${itemName(it)}${it.mergeLevel ? ` <span class="stars">${'★'.repeat(it.mergeLevel)}</span>` : ''}</b><span style="color:${rarityColor(it.rarity)}">${RARITIES[it.rarity].name} · ${tr('úr.')} ${it.level}</span></div>
      <div class="row-stats">${stats}</div></div>`;
  }).join('');
  const p = state.progress;
  const st = state.stats;
  const best = `${p.maxLayer + 1}. ${getLayer(p.maxLayer).name}, ${tr('vlna {v}', { v: p.maxWave })}`;
  const tile = (label, val) => `<div class="stat-tile"><span>${label}</span><b>${val}</b></div>`;
  return `
    <div class="card hero-card">
      <svg class="hero-big" viewBox="20 0 120 152">${heroSvg(state.equipment, cosmeticColors(state)).replaceAll('hero-aura', 'hero-aura-b').replaceAll('id="hg', 'id="hb').replaceAll('url(#hg', 'url(#hb')}</svg>
      <div class="hero-sum">
        <h3>${tr('Trpaslík')}</h3>
        <div class="hero-power">${ICON.power}<b>${formatNumber(power)}</b><span>${tr('síla')}</span></div>
        <div class="hero-line">${ICON.attack}<b>${formatNumber(h.attack)}</b><span>${tr('útok / {v} s', { v: (Math.round(h.attackInterval * 100) / 100).toLocaleString(locale()) })}</span></div>
        <div class="hero-line">${ICON.hp}<b>${formatNumber(h.hp)}</b><span>${tr('zdraví')}</span></div>

// Sady vybavení: kolik kusů je nasazeno a které bonusy platí
function setBonusText(b) {
  if (b.kind === 'attack') return tr('+{v} % útoku', { v: b.v });
  if (b.kind === 'hp') return tr('+{v} % zdraví', { v: b.v });
  const e = Object.values(RUNE_POLISH.effects).find((x) => x.stat === b.kind);
  return `${e?.name ?? b.kind} +${b.v} %`;
}
function setsHtml(state) {
  const counts = setCounts(state.equipment);
  const rows = SETS.list.map((d) => {
    const n = counts[d.id] ?? 0;
    const tiers = Object.entries(d.bonus).map(([need, b]) => `<span class="set-tier ${n >= Number(need) ? 'on' : ''}">${need}: ${setBonusText(b)}</span>`).join('');
    return `<div class="row ${n ? '' : 'locked-soft'}"><div class="row-main"><b style="color:${d.color}">${d.name} <span class="lv">${n}/6</span></b><span class="set-tiers">${tiers}</span></div></div>`;
  }).join('');
  return `<h4>${tr('Sady vybavení')} <span class="q-time">${tr('od Vzácných předmětů')}</span></h4><div class="card list">${rows}</div>`;
}

// ---------------- Pomocníci ----------------
function companionsHtml(state) {
  const rows = COMPANIONS.map((c) => {
    const lv = companionLevel(state, c.id);
    const matName = LAYERS.find((l) => l.material.id === c.material)?.material.name ?? c.material;
    let action;
    if (lv === 0 && c.unlockShards) {
      action = `<button class="buy small" data-action="cp-unlock" data-id="${c.id}" ${canUnlockFree(state, c) ? '' : 'disabled'}>${ICON.shard}${c.unlockShards}</button>`;
    } else if (lv === 0) {
      action = canUnlockFree(state, c)
        ? `<button class="buy small" data-action="cp-unlock" data-id="${c.id}">${tr('Odemknout')}</button>`
        : `<button class="buy small" data-action="cp-unlock-d" data-id="${c.id}" ${state.diamonds < c.unlockDiamonds ? 'disabled' : ''}>${ICON.diamond}${c.unlockDiamonds}</button>`;
    } else if (lv >= c.max) {
      action = `<span class="done-mark">max.</span>`;
    } else {
      const cost = companionUpgradeCost(c, lv);
      const ok = cost.shards ? (state.dungeons?.shards ?? 0) >= cost.shards : (state.materials[c.material] ?? 0) >= cost.material && state.gold >= cost.gold;
      action = cost.shards ? `<button class="buy small" data-action="cp-up" data-id="${c.id}" ${ok ? '' : 'disabled'}>${ICON.shard}${cost.shards}</button>` : `<button class="buy small col" data-action="cp-up" data-id="${c.id}" ${ok ? '' : 'disabled'}><span>${formatNumber(cost.material)} ${matName}</span><span>${ICON.gold}${formatNumber(cost.gold)}</span></button>`;
    }
    const info = lv === 0
      ? `${c.desc(1)} · ${c.unlockShards ? tr('za {v} útržků z kobek', { v: c.unlockShards }) : tr('zdarma od hloubky {v}', { v: c.unlockDepth })}`
      : `${c.desc(lv)}${lv < c.max ? ` → ${c.desc(lv + 1)}` : ''}`;
    return `<div class="row ${lv ? '' : 'locked-soft'}"><div class="tile plain cp-tile">${COMPANION_SVG[c.id]}</div>
      <div class="row-main"><b>${c.name}${lv ? ` <span class="lv">${tr('úr.')} ${lv}/${c.max}</span>` : ''}</b><span>${info}</span></div>${action}</div>`;
  }).join('');
  return `<h4>${tr('Pomocníci')}</h4><div class="card list">${rows}</div>`;
}

function combatBonusHtml(state) {
  const r = runeCombatStats(state);
  const items = [['critChance', tr('Kritický zásah'), tr('% šance')], ['critDamage', tr('Krit. poškození'), tr('% navíc')], ['attackSpeed', tr('Rychlost útoku'), '%'],
    ['lifesteal', tr('Krádež života'), '%'], ['regen', tr('Regenerace'), '%/s'], ['resist', tr('Odolnost'), '%'], ['dodge', tr('Úhyb'), '%'], ['bossDamage', tr('Drtič bossů'), '%']]
    .filter(([k]) => r[k] > 0)
    .map(([k, n, u]) => `<div class="stat-tile"><span>${n}</span><b>+${(Math.round(r[k] * 10) / 10).toLocaleString(locale())} ${u}</b></div>`).join('');
  return items ? `<h4>${tr('Bojové bonusy (runy a relikvie)')}</h4><div class="stat-grid">${items}</div>` : '';
}

// Uhlí a boj za dobu nepřítomnosti. Vrací shrnutí pro okno, nebo null.
function catchUp(seconds) {
  lastCoalTick = Date.now();
  if (!(seconds > 0)) return null;
  const coal = tickCoal(state, seconds);
  refreshQuests(state);
  const sum = simulateOffline(state, seconds, { onKill: (e) => {
    track(state, 'kill');
    if (e.isBoss) { track(state, 'boss'); firstBossReward(state, e.layer); addPassXp(state, PASS.xpBoss); }
  } });
  if (sum) sum.coal += coal;
  return sum;
}

  autoAcc += dt;
  if (autoAcc < PREMIUM.autoForgeInterval) return;
  autoAcc = 0;
  const item = forgeOnce();
  if (!item) return;
  fx.anvilStrike();
  if (item.rarity >= 4 || canMergePending(state)) { // legendárka – rozhodne hráč
    render();
    fx.rarityReveal(item.rarity);
    sfx.reveal(item.rarity);
    return;
  }

  const res = better ? equipPending(state) : smeltPending(state);
  if (!better || res?.smelted) track(state, 'smelt');
  if (better) sfx.equip(); else sfx.tap();
  render();
}

  if (r.gold) p.push(`+${formatNumber(r.gold)}${ICON.gold}`);
  return p.join(' ');
}

function fmtDuration(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}

  if (!sum) return;
  if (!instant && sum.seconds < OFFLINE_CHEST.minMinutes * 60) return; // krátká pauza = bez truhly
  const from = sum.fromDepth, to = sum.toDepth;
  const where = `${getLayer(state.progress.layer).name}, ${tr('vlna {v}', { v: state.progress.wave })}`;
  const line = (icon, label, val) => `<div class="rw-line">${icon}<span>${label}</span><b>${val}</b></div>`;
  const mats = Object.entries(sum.materials).map(([n, v]) => line('', n, `+${formatNumber(v)}`)).join('');
  const sub = `${fmtDuration(sum.seconds)}${sum.capped ? ` ${tr('(víc se nepočítá – max. {v} h)', { v: Math.round(sum.seconds / 3600) })}` : ''} · ${tr('trpaslík bojoval sám')}`;
  const loot = line(ICON.attack, tr('Poraženo příšer'), formatNumber(sum.kills))
    + line(ICON.power, tr('Postup'), to > from ? `${tr('+{v} vln', { v: to - from })} → ${where}` : to < from ? `${tr('ústup o {v}', { v: from - to })} → ${where}` : `${tr('drží se')}: ${where}`)
    + line(ICON.gold, tr('Zlato'), `+${formatNumber(sum.gold)}`)
    + (sum.coal ? line(ICON.coal, tr('Uhlí'), `+${formatNumber(sum.coal)}`) : '')
    + mats;
  const done = () => openReward(title, sub, loot, [{ label: tr('Vyzvednout'), cls: 'primary', onClick: () => { sfx.coin(); } }]);
  if (instant) { done(); return; }
  // Truhla z hlubin: nejdřív zavřená, klepnutím se otevře
  openReward(tr('Truhla z hlubin'), sub,
    `<button class="big-chest" id="big-chest" aria-label="${tr('Otevřít truhlu')}">${chestSvg()}<span>${tr('Klepni a otevři')}</span></button>`, []);
  const btn = document.getElementById('big-chest');

      state.autoForge.on = !state.autoForge.on; sfx.tap(); render();
    } else if (b.dataset.action === 'cos') {
      if (useCosmetic(state, b.dataset.kind, b.dataset.id)) { sfx.buy(); render(); }
    } else if (b.dataset.action === 'open-pass') {
      openPass();
    } else if (b.dataset.action === 'cp-unlock' || b.dataset.action === 'cp-unlock-d') {
      if (unlockCompanion(state, b.dataset.id, b.dataset.action === 'cp-unlock-d')) { sfx.levelUp(); saveState(state); render(); }
    } else if (b.dataset.action === 'cp-up') {
      if (upgradeCompanion(state, b.dataset.id)) { sfx.buy(); render(); }
    } else if (b.dataset.action === 'rune') {
      if (buyRuneUpgrade(state, b.dataset.id)) { sfx.buy(); render(); }
    } else if (b.dataset.action === 'prestige') {
      const gain = runesForDepth(runDepth(state));
      openReward(tr('Zapečetit kovárnu?'), tr('Začneš znovu od Hlíny, ale silnější.'),
        `<div class="rw-line"><span>${tr('Získáš Runy předků')}</span><b>+${gain}</b></div>
         <div class="rw-line"><span>${tr('Ztratíš')}</span><b>${tr('vybavení, zlato, rudu, úroveň kovárny')}</b></div>
         <div class="rw-line"><span>${tr('Zůstane')}</span><b>${tr('runy, legendy, suroviny hlubin')}</b></div>`,
        [{ label: tr('Zrušit') }, { label: tr('Zapečetit'), cls: 'primary', onClick: () => {
          const got = doPrestige(state);
          if (!got) return;
          battle = createBattle(state);
          resetBattleView();
          saveState(state);
          sfx.levelUp();
          fx.banner(tr('KOVÁRNA ZAPEČETĚNA'), '#b98cff', tr('+{v} run předků', { v: got }));
          switchTab('hero');
        } }]);
    } else if (b.dataset.action === 'buy-chest') {
      const item = buyChest(state);
      if (!item) return;
      trackForge(item);
      fx.anvilStrike();
      sfx.anvil();
      render();
      fx.rarityReveal(item.rarity);
      sfx.reveal(item.rarity);
    }
  });

  const menu = document.getElementById('menu');
  document.getElementById('btn-menu').addEventListener('click', () => {
    const saved = new Date(state.lastSaved).toLocaleTimeString(locale());
    document.getElementById('save-info').textContent = `${tr('Naposledy uloženo: {v}', { v: saved })} · ${tr('verze')} ${document.querySelector('meta[name="build"]')?.content ?? 'dev'}`;
    document.getElementById('sound-status').textContent = sfx.soundStatus();
    menu.classList.remove('hidden');
  });
  document.getElementById('btn-close-menu').addEventListener('click', () => menu.classList.add('hidden'));
  // Přepnutí jazyka: uložit a načíst znovu (přeloží se úplně všechno)
  document.querySelectorAll('.lang-switch button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.lang === getLang()) return;
    state.settings.lang = b.dataset.lang;
    saveState(state);
    location.reload();
  }));
  document.getElementById('btn-test-sound').addEventListener('click', () => {
    sfx.unlock();
    setTimeout(() => { sfx.anvil(); sfx.reveal(3); document.getElementById('sound-status').textContent = sfx.soundStatus(); }, 50);
  });
  document.getElementById('btn-sound').addEventListener('click', () => {
    state.settings.sound = !state.settings.sound;
    applySound();
    sfx.tap();
    saveState(state);
  });
  document.getElementById('btn-music').addEventListener('click', () => {
    state.settings.music = !state.settings.music;
    applySound();
    sfx.tap();
    saveState(state);
  });
  document.getElementById('vol').addEventListener('input', (e) => {
    state.settings.volume = Number(e.target.value) / 100;
    applySound();
  });
  document.getElementById('vol').addEventListener('change', () => { sfx.coin(); saveState(state); });
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm(tr('Opravdu smazat veškerý postup?'))) return;
    const keep = state.settings;
    state = resetState();
    state.settings = keep;
    battle = createBattle(state);
    resetBattleView();
    saveState(state);
    render();
    menu.classList.add('hidden');
    showToast(tr('Nová hra začala'));
  });
}

function applySound() {
  const { sound, volume } = state.settings;
  const music = state.settings.music !== false;
  sfx.setSound(sound, volume);
  sfx.setMusic(music);
  const mb = document.getElementById('btn-music');
  mb.setAttribute('aria-pressed', String(music));
  mb.classList.toggle('on', music);
  const btn = document.getElementById('btn-sound');
  btn.setAttribute('aria-pressed', String(sound));
  btn.classList.toggle('on', sound);
  document.getElementById('vol').value = Math.round(volume * 100);
}

function announceSmelt(res) {
  fx.bumpResource('res-gold');
  if (res.upgradeReady) showToast(`${tr('Přetaveno')} ${rewardText(res)} · ${tr('kovárnu lze vylepšit!')}`, 2200);
  else showToast(`${tr('Přetaveno')} ${rewardText(res)}`);
}

function startLoop() {
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000); // max 250 ms, ať po návratu z pozadí neskočí
    last = now;
    update(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Uhlí podle skutečného času (běží i když je karta na pozadí a rAF stojí)
  setInterval(() => {
    const t = Date.now();
    if (tickCoal(state, (t - lastCoalTick) / 1000) > 0) fx.bumpResource('res-coal');
    const rdone = tickResearch(state, t);
    if (rdone) { researchDone(rdone); saveState(state); }
    if (tab === 'research' && state.research?.active) render(); // odpočet
    lastCoalTick = t;
  }, 1000);
}

function update(dt) {
  autoForgeTick(dt);
  if (dungeonFight) { updateDungeonFight(dt); return; }
  dt *= getBonuses(state).speed; // zrychlení boje za diamanty
  const events = updateCombat(state, battle, dt);
  updateBattleView(state, battle, dt);
  updateSkillBar(battle);
  sfx.musicMood(getLayer(state.progress.layer).baseId, !!battle.monster?.isBoss);
  let needFull = false;
  for (const e of events) {
    switch (e.type) {
      case 'heroHit': sfx.heroHit(); animateAttack('hero'); fx.floatText('monster', e.crit ? `${formatNumber(e.dmg)}!` : formatNumber(e.dmg), e.crit ? 'crit' : 'dmg'); break;
      case 'dodge': fx.floatText('hero', tr('Úhyb'), 'dodge'); break;
      case 'petFire': petFire(e.dmg, e.id); break;
      case 'skill': skillUsed(e); break;
      case 'monsterHit': sfx.heroHurt(); animateAttack('monster'); fx.floatText('hero', `-${formatNumber(e.dmg)}`, 'hurt'); break;
      case 'kill': {
        needFull = true;
        track(state, 'kill');
        if (e.isBoss) {
          track(state, 'boss');
          addPassXp(state, PASS.xpBoss);
          const d = firstBossReward(state, e.layer);
          if (d) setTimeout(() => { sfx.buy(); showToast(`${tr('První porážka bosse')}: +${d}${ICON.diamond}`, 2200); }, 600);
        }
        fx.goldGain(formatNumber(e.gold));
        sfx.kill();
        setTimeout(sfx.coin, 120);
        const coal = rollCoalDrop(state, e.isBoss);
        if (coal) setTimeout(() => { fx.coalGain(coal); sfx.pickup(); }, 250);
        const mat = rollMaterialDrop(state, e.isBoss);
        if (mat) track(state, 'material', mat.amount);
        if (mat) setTimeout(() => { fx.floatText('monster', `+${mat.amount} ${mat.name}`, 'mat'); sfx.pickup(); }, 500);
        break;
      }
      case 'waveClear': needFull = true; track(state, 'wave'); break;
      case 'waveStart': if (e.isBoss) sfx.boss(); if (e.isBoss) fx.banner('BOSS!', '#ff3b5c', battle.monster.name); break;
      case 'layerClear': sfx.layer(); fx.banner(tr('VRSTVA {v}', { v: e.layer + 1 }), '#1fc7a8', getLayer(e.layer).name); break;
      case 'heroDeath': sfx.death(); fx.heroDeath(); showToast(tr('Trpaslík padl – ústup o vlnu zpět'), 2000); needFull = true; break;
    }
  }
  if (needFull) render();
  else renderBattle(state, battle);
}

// Dráček plivne oheň: animace dráčka, plamen k příšeře, číslo poškození
function petFire(dmg, id) {
  sfx.fire();
  const d = document.querySelector('#companions .pet');
  if (d) { d.classList.remove('breath'); void d.getBoundingClientRect(); d.classList.add('breath'); }
  fx.petFlame(petDef(id)?.color);
  setTimeout(() => { animateHit(); fx.floatText('monster', formatNumber(dmg), 'fire'); }, 260);
}
function animateHit() {
  const s = document.querySelector('#monster .sprite');
  if (!s) return;
  s.classList.remove('hit'); void s.getBoundingClientRect(); s.classList.add('hit');
}

// ---------------- Měření (anonymní, jen když je zapnuté v configu) ----------------
function trackSession() {
  const day = Math.floor((Date.now() - state.createdAt) / 86400000);
  analytics.event('start');
  analytics.once(state, `den-${day}`);           // návraty: den 0, 1, 2, 7…
  const started = Date.now();
  for (const m of [5, 15, 30, 60]) setTimeout(() => analytics.event(`hrani-${m}min`), m * 60000);
  setInterval(() => analytics.once(state, `vrstva-${state.progress.maxLayer + 1}`), 60000);
  void started;
}

// ---------------- Odemykání a cíle ----------------
const TAB_UNLOCK = { shop: 'shop', dungeons: 'dungeons', research: 'research' };
function tabOpen(t) { return !TAB_UNLOCK[t] || isUnlocked(state, TAB_UNLOCK[t]); }

function announceUnlocks() {
  const fresh = checkUnlocks(state);
  fresh.forEach((u, i) => setTimeout(() => {
    sfx.levelUp();
    fx.banner(tr('ODEMČENO'), '#1fc7a8', u.name);
    const nb = document.querySelector(`#nav button[data-tab="${u.id}"]`) ?? (['skills', 'pets', 'more'].includes(u.id) ? document.querySelector('#nav button[data-tab="hero"]') : null);
    nb?.classList.add('new');
    analytics.event(`unlock-${u.id}`);
  }, 400 + i * 1600));
  if (fresh.length) saveState(state);
}

function renderLocks() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('locked', !tabOpen(b.dataset.tab)));
  document.getElementById('btn-quests').classList.toggle('hidden', !isUnlocked(state, 'quests'));
  document.getElementById('btn-wheel').classList.toggle('hidden', !isUnlocked(state, 'quests'));
  document.querySelector('#btn-wheel .badge').classList.toggle('hidden', !wheelFree(state));
  document.getElementById('btn-chances').classList.toggle('locked', !isUnlocked(state, 'ingredients'));
  renderGoal();
}

function renderGoal() {
  const c = currentGoal(state);
  const el = document.getElementById('goal');
  const html = `<span class="g-ico">${c.done ? ICON.gift : ICON.target}</span><span class="g-txt">${goalText(c.goal)}</span><b>${c.done ? tr('Vyzvednout!') : `${formatNumber(c.have)}/${formatNumber(c.need)}`}</b>`;
  if (el.dataset.v !== html) { el.dataset.v = html; el.innerHTML = html; }
  el.classList.toggle('done', c.done);
}

function claimCurrentGoal() {
  const idx = state.goals?.index ?? 0;
  const r = claimGoal(state);
  if (!r) { sfx.tap(); showToast(goalText(currentGoal(state).goal)); return; }
  sfx.buy(); setTimeout(sfx.levelUp, 150);
  const parts = [];
  if (r.gold) parts.push(`+${formatNumber(r.gold)}${ICON.gold}`);
  if (r.coal) parts.push(`+${formatNumber(r.coal)}${ICON.coal}`);
  if (r.diamonds) parts.push(`+${formatNumber(r.diamonds)}${ICON.diamond}`);
  if (r.scrolls) parts.push(`+${formatNumber(r.scrolls)}${ICON.scroll}`);
  showToast(`${tr('Cíl splněn')} ${parts.join(' ')}`, 2200);
  analytics.event(`goal-${idx + 1}`);
  saveState(state);
  render();
}

// Akce nových záložek (kobky, dovednosti, mazlíčci, výzkum). Vrací true, když akci obsloužila.
function panelAction(b) {
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case 'dg-fight': enterDungeon(id); return true;
    case 'shaft-go': enterDungeon('shaft'); return true;
    case 'dg-relic': if (upgradeRelic(state, id)) { sfx.levelUp(); fx.bumpResource('power'); saveState(state); } else sfx.denied(); return true;
    case 'dg-key': if (buyKey(state, id)) { sfx.buy(); saveState(state); } else sfx.denied(); return true;
    case 'dg-sweep': {
      const r = sweepDungeon(state, id);
      if (!r) return true;
      sfx.buy();
      const mats = Object.entries(r.matsGot).map(([m, n]) => `+${n} ${materialInfo(m).name}`).join(', ');
      showToast(`${dungeonRewardHtml({ ...r, mats: 0 })}${mats ? ` ${mats}` : ''}`, 2400);
      saveState(state);
      return true;
    }
    case 'sk-summon': {
      const r = summonSkill(state);
      if (!r) { sfx.denied(); return true; }
      const def = skillDef(r.id);
      sfx.reveal(def.rarity);
      fx.rarityReveal(def.rarity);
      showToast(r.isNew ? `${tr('Nová dovednost')}: <b style="color:${RARITIES[def.rarity].color}">${def.name}</b>`
        : r.levelUp ? `<b style="color:${RARITIES[def.rarity].color}">${def.name}</b> → ${tr('úr.')} ${skillLevel(state, r.id)}`
          : `${def.name} +1`, 2200);
      saveState(state);
      return true;
    }
    case 'sk-toggle': if (toggleSkill(state, id)) { sfx.equip(); saveState(state); } else sfx.denied(); return true;
    case 'pet-hatch': {
      const r = hatchEgg(state);
      if (!r) { sfx.denied(); return true; }
      const def = petDef(r.id);
      sfx.reveal(def.rarity); fx.rarityReveal(def.rarity);
      showToast(r.isNew ? `${tr('Nový mazlíček!')} <b style="color:${RARITIES[def.rarity].color}">${def.name}</b>` : `${def.name} → ${tr('úr.')} ${petLevel(state, r.id)}`, 2200);
      saveState(state);
      return true;
    }
    case 'pet-active': if (setActivePet(state, id)) { sfx.equip(); saveState(state); } return true;
    case 'pet-up': if (upgradePet(state, id)) { sfx.buy(); saveState(state); } else sfx.denied(); return true;
    case 'pet-dragon': if (buyDragon(state)) { sfx.levelUp(); showToast(tr('Nový mazlíček!')); saveState(state); } else sfx.denied(); return true;
    case 'rs-start': if (startResearch(state, id)) { sfx.buy(); saveState(state); } else sfx.denied(); return true;
    case 'rs-finish': { const done = finishNow(state); if (done) { researchDone(done); saveState(state); } else sfx.denied(); return true; }
    default: return false;
  }
}

function researchDone(id) {
  sfx.levelUp();
  showToast(`${tr('Výzkum dokončen')}: <b>${researchDef(id).name}</b> ${tr('úr.')} ${researchLevel(state, id)}`, 2400);
  render();
}

// Dovednost v boji: název nad hrdinou, poškození / léčení
function skillUsed(e) {
  const def = skillDef(e.id);
  sfx.skill(def.kind);
  fx.floatText('hero', def.name, 'skill');
  if (e.dmg) { animateHit(); fx.floatText('monster', formatNumber(e.dmg), 'crit'); if (def.stun) fx.shake?.(); }
  if (e.heal) setTimeout(() => fx.floatText('hero', `+${formatNumber(e.heal)}`, 'heal'), 200);
}

// Ukazatel nabíjení dovedností v boji (každý snímek)
function updateSkillBar(b) {
  document.querySelectorAll('#skill-bar .sb-skill').forEach((el) => {
    const left = cooldownLeft(b, el.dataset.id);
    const h = `${Math.round(left * 100)}%`;
    const i = el.firstElementChild.nextElementSibling;
    if (i && i.style.height !== h) i.style.height = h;
    el.classList.toggle('ready', left <= 0.02);
  });
}

// ---------------- Kobky ----------------
function renderDungeonStage() {
  const f = dungeonFight;
  const label = `${fightName(f)} · ${fightLevel(f)}`;
  const dl = document.getElementById('depth-label');
  if (dl.textContent !== label) dl.textContent = label;
  const t = document.getElementById('dg-timer');
  const txt = `${Math.ceil(f.timeLeft)} s`;
  if (t.textContent !== txt) t.textContent = txt;
  t.classList.toggle('low', f.timeLeft <= 8);
}


// Název a úroveň souboje (kobka / šachta)
function fightName(f) { return f.dungeon === 'shaft' ? tr('Hlubinná šachta') : dungeonDef(f.dungeon).name; }
function fightLevel(f) { return f.dungeon === 'shaft' ? tr('patro −{v}', { v: f.level }) : tr('úroveň {v}', { v: f.level }); }

function enterDungeon(id) {
  const f = id === 'shaft' ? startShaft(state) : startDungeon(state, id);
  if (!f) { sfx.denied(); return; }
  dungeonFight = f;
  if (tab !== 'forge') switchTab('forge');
  document.getElementById('battle').classList.add('in-dungeon');
  sfx.boss();
  fx.banner(fightName(f), '#f2c14e', `${f.monster.name} · ${fightLevel(f)}`);
  render();
}

function leaveDungeon() {
  dungeonFight = null;
  document.getElementById('battle').classList.remove('in-dungeon');
  battle = createBattle(state); // hlavní boj pokračuje aktuální vlnou
  render();
}

function updateDungeonFight(dt) {
  const f = dungeonFight;
  const events = updateDungeon(state, f, dt);
  updateBattleView(state, f, dt);
  updateSkillBar(f);
  sfx.musicMood(getLayer(f.themeLayer ?? 0).baseId, true);
  for (const e of events) {
    switch (e.type) {
      case 'heroHit': sfx.heroHit(); animateAttack('hero'); fx.floatText('monster', e.crit ? `${formatNumber(e.dmg)}!` : formatNumber(e.dmg), e.crit ? 'crit' : 'dmg'); break;
      case 'dodge': fx.floatText('hero', tr('Úhyb'), 'dodge'); break;
      case 'petFire': petFire(e.dmg, e.id); break;
      case 'skill': skillUsed(e); break;
      case 'monsterHit': sfx.heroHurt(); animateAttack('monster'); fx.floatText('hero', `-${formatNumber(e.dmg)}`, 'hurt'); break;
      case 'dungeonEnd': {
        const shaft = f.dungeon === 'shaft';
        saveState(state);
        if (e.win) {
          sfx.kill(); setTimeout(sfx.levelUp, 300);
          analytics.once(state, shaft ? `sachta-${f.level}` : `kobka-${f.dungeon}-${f.level}`);
          const mats = Object.entries(e.reward.matsGot).map(([id, n]) => `<div class="rw-line"><span>${materialInfo(id).name}</span><b>+${n}</b></div>`).join('');
          const next = shaft ? tr('odemčeno patro −{v}', { v: f.level + 1 }) : tr('odemčena úroveň {v}', { v: f.level + 1 });
          const btns = shaft
            ? [{ label: tr('Další patro'), cls: 'primary', onClick: () => { sfx.coin(); leaveDungeon(); enterDungeon('shaft'); } },
              { label: tr('Zpět'), onClick: () => { sfx.coin(); leaveDungeon(); } }]
            : [{ label: tr('Vyzvednout'), cls: 'primary', onClick: () => { sfx.coin(); leaveDungeon(); } }];
          setTimeout(() => openReward(tr('Vítězství!'), `${fightName(f)} · ${fightLevel(f)} · ${next}`,
            `<div class="q-rew dg-reward">${dungeonRewardHtml({ ...e.reward, mats: 0 })}</div>${mats}${e.reward.shards ? `<div class="rw-line">${ICON.shard}<span>${tr('Útržky prastaré výzbroje')}</span><b>+${e.reward.shards}</b></div>` : ''}`,
            btns), 900);
        } else {
          if (!e.timeout) { sfx.death(); fx.heroDeath(); }
          setTimeout(() => openReward(e.timeout ? tr('Čas vypršel') : tr('Porážka'), `${fightName(f)} · ${fightLevel(f)}`,
            `<p class="note">${shaft ? tr('Šachta nepotřebuje klíče – zesil a zkus to znovu.') : tr('Klíč ti zůstal. Vylepši vybavení (kování, sloty, runy) a zkus to znovu.')}</p>`,
            [{ label: tr('Zpět do hlubin'), cls: 'primary', onClick: leaveDungeon }]), 900);
        }
        break;
      }
    }
  }
  renderBattle(state, f);
  renderDungeonStage();
}

// Pro ladění v konzoli prohlížeče: window.game.state
window.game = { get state() { return state; }, save: () => saveState(state) };

init();

return {  };
})();

})();
</script>
